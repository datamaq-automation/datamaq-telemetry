# =====================================================================
# Configuración Mosquitto MQTT Broker — Datamaq Telemetry Platform
# =====================================================================

# Directorio de persistencia
persistence true
persistence_location /var/lib/mosquitto/

# Logging
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true

# Listener Estándar MQTT (TCP)
# Puerto 1883 para telemetría directa desde medidores Powermeter
listener 1883 0.0.0.0
allow_anonymous false

# Listener WebSockets (Opcional, para dashboards frontend directos)
listener 9001 0.0.0.0
protocol websockets

# =====================================================================
# Listener Seguro con TLS (puerto 8883 con SSL)
# =====================================================================
listener 8883 0.0.0.0
cafile /etc/letsencrypt/live/mqtt.datamaq.com.ar/chain.pem
certfile /etc/letsencrypt/live/mqtt.datamaq.com.ar/cert.pem
keyfile /etc/letsencrypt/live/mqtt.datamaq.com.ar/privkey.pem
require_certificate false
