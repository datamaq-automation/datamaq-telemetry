# data/organizaciones.yml — Modelo Declarativo de Activos (ANSI/ISA-95 & ISO 50001)
# Nivel 4 (Empresa / Tenant) y Nivel 3 (Sitio / Planta)
#
# Qué va acá y qué no (CONVENTIONS §3.5 y §3.6): datos maestros que define un ingeniero
# con un plano en la mano. NO va el estado comercial (plan, PRO, modo free: tabla
# `organizations` en MySQL) ni nada operativo.
#
# Claves opcionales por planta, con precedencia sobre MySQL cuando se declaran:
#   medidores:                      # datos de puesta en servicio de cada Powermeter
#     - id: "<uuid del dispositivo>"
#       tag_ubicacion: "…"          # tag físico ISA-5.1 del tablero
#       tipo_instalacion: "CONSUMO" # CONSUMO | GENERACION_FV | …
#       fases_con_ti: "R,S,T"       # fases con TI conectado
#   nodos_unifilar[tipo=acometida]: # contrato con la distribuidora (lo heredan los medidores aguas abajo)
#       categoria_tarifaria: "T3-MT"
#       penalizacion_reactiva_aplica: true
# Un campo declarado acá no se puede editar por PATCH /dispositivos (422). Sin fuente
# verificable (placa, factura, plano), el campo se omite; scripts/exportar_instalacion_medidores.py
# vuelca lo que hoy dice MySQL como BORRADOR para confirmarlo en campo.

organizaciones:
  - id: "09c09578-a860-4c61-8e97-2a13240adb8f"
    nombre: "Hogar (medidor doméstico)"
    email_contacto: "invitado@datamaq.com.ar"
    plantas:
      - id: "2a4dd726-3e21-4b24-8993-51c2f5d4d65f"
        nombre: "Casa"
        zonas:
          - id: "area-casa-principal"
            nombre: "Tablero Principal Hogar"
            coordenadas: { x: 10, y: 10, ancho: 80, alto: 80 }
        dispositivos_layout:
          - id: "lay-casa-1"
            dispositivo_id: "2812d2af-b1cf-4daa-a379-40102fdb152d"
            zona_id: "area-casa-principal"
            posicion: { x: 50, y: 50 }
        nodos_unifilar:
          - id: "nodo-acometida-hogar"
            nombre: "Medidor Principal Hogar"
            tipo: "acometida"
            tension_nominal_v: 220.0
            device_id: "2812d2af-b1cf-4daa-a379-40102fdb152d"
            # potencia_nominal_kw: sin dato (el 5.5 anterior era inventado). Cargar solo con
            # el valor real (potencia contratada del suministro), nunca estimado.
            uso_significativo: false
            categoria_uso: "ILUMINACION"

  - id: "cf82b4be-0798-4beb-8978-2a27612d5761"
    nombre: "Vajillas Durax S.A."
    email_contacto: "instrumental@vajillasdurax.com.ar"
    plantas:
      - id: "c64fd625-0037-4caa-b68a-800e8e0ee548"
        nombre: "Planta Principal Durax"
        zonas:
          - id: "area-durax-trafo-1"
            nombre: "Sala de Trafo 1"
            coordenadas: { x: 5, y: 5, ancho: 40, alto: 80 }
          - id: "area-durax-trafo-2"
            nombre: "Sala de Trafo 2"
            coordenadas: { x: 50, y: 5, ancho: 40, alto: 80 }
        dispositivos_layout:
          - id: "lay-durax-1"
            dispositivo_id: "51048a93-f1f3-4283-a708-24cbd39c7192"
            zona_id: "area-durax-trafo-1"
            posicion: { x: 20, y: 30 }
          - id: "lay-durax-2"
            dispositivo_id: "b5f4bcd6-b017-4796-bb3d-efcfb50dc8f0"
            zona_id: "area-durax-trafo-2"
            posicion: { x: 70, y: 30 }
        nodos_unifilar:
          # Nodo virtual: punto de medición en MT de la distribuidora, sin medidor propio.
          # Su valor es la suma de los dos trafos (medidores frontera).
          - id: "nodo-durax-acometida-mt"
            nombre: "Acometida MT"
            tipo: "acometida"
            tension_nominal_v: 13200.0  # fuente: confirmado por el usuario, 2026-09-12
          # Esta planta es "Cristal Avellaneda" (confirmado por el usuario, 2026-09-13).
          # TOPOLOGÍA DE MEDICIÓN (fuente: usuario, 2026-09-13). Cada Powermeter NO mide
          # un trafo: sus TI están sobre un circuito sumador de intensidades preexistente
          # (el del regulador del banco de capacitores), que suma los secundarios de DOS
          # transformadores. Es decir: cada nodo "transformador" de abajo representa un
          # GRUPO de dos trafos en paralelo sobre una misma barra, no una máquina.
          # El modelo actual (un solo parent_id) no puede declarar los dos trafos por
          # separado alimentando la misma barra — limitación registrada en tmp/dudas.md §12.
          # SIN DATO DE PLACA: los "300 kW / 150 kW" que figuraban acá eran una
          # alucinación de un LLM (2026-09-13), no lectura de chapa. No cargar
          # capacidad_nominal_kva hasta tener foto de la placa de cada transformador.
          - id: "nodo-durax-trifasico-1"
            nombre: "Transformación Usina (2 trafos en paralelo)"
            tipo: "transformador"
            tension_nominal_v: 380.0
            parent_id: "nodo-durax-acometida-mt"
          - id: "nodo-durax-powermeter-bf2c"
            nombre: "Transformación Horno (2 trafos en paralelo)"
            tipo: "transformador"
            tension_nominal_v: 380.0
            parent_id: "nodo-durax-acometida-mt"
          # TGBT = barra de BT común a los dos trafos del grupo. El Powermeter mide la
          # sumatoria vía TI sobre TI (secundario del sumador del banco de capacitores),
          # aguas arriba del banco: la Q que ve es la YA COMPENSADA por el banco.
          # Relación de TI del sumador: no registrada. Escala verificada en campo: la
          # corriente del Powermeter coincide con pinza amperométrica (usuario,
          # 2026-09-13; fecha y valores del contraste sin registrar). Esa verificación
          # cubre |I| (y por lo tanto la escala de P, Q y energía); NO cubre el error
          # de ángulo del TI sobre TI ni el signo de Q (ver tmp/dudas.md §13).
          - id: "nodo-durax-tgbt-usina"
            nombre: "TGBT Usina"
            tipo: "tgbt"
            tension_nominal_v: 380.0
            parent_id: "nodo-durax-trifasico-1"
            device_id: "51048a93-f1f3-4283-a708-24cbd39c7192"
            uso_significativo: true
            categoria_uso: "FUERZA_MOTRIZ"
          - id: "nodo-durax-tgbt-horno"
            nombre: "TGBT Horno"
            tipo: "tgbt"
            tension_nominal_v: 380.0
            parent_id: "nodo-durax-powermeter-bf2c"
            device_id: "b5f4bcd6-b017-4796-bb3d-efcfb50dc8f0"
            uso_significativo: true
            categoria_uso: "FUERZA_MOTRIZ"

  - id: "edebb9a0-85e5-4bde-a370-e64bd9b9608c"
    nombre: "Cooperativa de Trabajo Unión Papelera Platense Ltda"
    email_contacto: "unionpapeleraplatense@hotmail.com"
    plantas:
      - id: "4f68f653-a604-4834-8154-31f938248572"
        nombre: "Planta Principal UPP"
        zonas:
          - id: "area-upp-papelera"
            nombre: "Nave Principal UPP"
            coordenadas: { x: 10, y: 10, ancho: 80, alto: 80 }
        dispositivos_layout:
          - id: "lay-upp-1"
            dispositivo_id: "a01b1642-ed29-4c3e-a793-f57de09504f8"
            zona_id: "area-upp-papelera"
            posicion: { x: 30, y: 40 }
          - id: "lay-upp-2"
            dispositivo_id: "ce7e5a9a-c5e8-4936-be9a-a2057ccf8b4c"
            zona_id: "area-upp-papelera"
            posicion: { x: 70, y: 40 }
        nodos_unifilar:
          # Nodo virtual: punto de medición en MT de la distribuidora, sin medidor propio.
          # Su valor es la suma de los dos trafos (medidores frontera).
          - id: "nodo-upp-acometida-mt"
            nombre: "Acometida MT"
            tipo: "acometida"
            tension_nominal_v: 13200.0  # fuente: confirmado por el usuario, 2026-09-12
          # Trafos 13,2 kV / 380 V: nodos virtuales; el medidor está en el TGBT de cada uno.
          # TOPOLOGÍA DE MEDICIÓN (fuente: usuario, 2026-09-13): los TI de cada Powermeter
          # están directamente en la salida del secundario de su transformador. Cada
          # medidor ve el 100 % de su trafo; el modelo trafo → tgbt es exacto acá.
          # SIN DATO DE PLACA: los "800 kW" que figuraban acá eran inventados (ver Durax).
          - id: "nodo-upp-trafo-arriba"
            nombre: "Trafo Arriba"
            tipo: "transformador"
            tension_nominal_v: 380.0
            parent_id: "nodo-upp-acometida-mt"
          - id: "nodo-upp-trafo-abajo"
            nombre: "Trafo Abajo"
            tipo: "transformador"
            tension_nominal_v: 380.0
            parent_id: "nodo-upp-acometida-mt"
          # TGBT: punto de medición real de cada trafo.
          - id: "nodo-upp-tgbt-arriba"
            nombre: "TGBT Arriba"
            tipo: "tgbt"
            tension_nominal_v: 380.0
            parent_id: "nodo-upp-trafo-arriba"
            device_id: "a01b1642-ed29-4c3e-a793-f57de09504f8"
            uso_significativo: true
            categoria_uso: "FUERZA_MOTRIZ"
          - id: "nodo-upp-tgbt-abajo"
            nombre: "TGBT Abajo"
            tipo: "tgbt"
            tension_nominal_v: 380.0
            parent_id: "nodo-upp-trafo-abajo"
            device_id: "ce7e5a9a-c5e8-4936-be9a-a2057ccf8b4c"
            uso_significativo: true
            categoria_uso: "FUERZA_MOTRIZ"
  - id: "20857cb6-eff2-4bd4-8cb9-36e4c63bcee3"
    nombre: "Cooperativa de Trabajo Los Constituyentes Ltda."
    plantas: []
