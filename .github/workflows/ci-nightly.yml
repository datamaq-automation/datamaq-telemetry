name: CI Nightly

# Job diario que detecta breaking changes de dependencias antes de que lleguen a producción.
# Instala desde requirements.txt (no .lock) para testear versiones más nuevas.
on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC = 11 PM ARG (UTC-3, horario estándar)

jobs:
  test-fresh-deps:
    name: Gauntlet con dependencias frescas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar desde requirements.txt (versiones frescas, no pinadas)
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements.txt

      - name: Correr gauntlet completo (integridad, format, type check, tests)
        run: bash scripts/pre-push.sh

      - name: Alertar por Telegram si falla
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="⚠️ CI Nightly falló — breaking change detectado en datamaq-telemetry

          Dependencias frescas (no pinadas) rompieron el build.

          Revisa los logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Posible solución:
          1. Revisar qué cambió en las dependencias
          2. Actualizar requirements.txt con versiones compatibles
          3. Regenerar requirements.lock: pip-compile requirements.txt -o requirements.lock"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -o /dev/null
