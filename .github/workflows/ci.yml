name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gauntlet:
    name: Gauntlet (integridad, ruff, pyright, unit, cobertura, integración)
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Guard: sin .env reales trackeados (D-2)"
        run: bash scripts/guard_secrets.sh

      - name: Checkout datamaq-data (repo independiente de datos maestros)
        uses: actions/checkout@v7
        with:
          repository: datamaq-automation/datamaq-data
          ssh-key: ${{ secrets.SSH_DEPLOY_KEY_DATA }}
          path: data

      - name: Detectar cambios de configuración (GitOps) vs código de producto
        id: changes
        run: |
          CHANGED_FILES=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || echo "")
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || echo "")
          fi

          if [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          fi

          echo "Archivos modificados detectados:"
          echo "$CHANGED_FILES"

          # Modo GitOps: SOLO si todos los cambios son config/docs (sin .py, .sh, .txt productivos)
          # Criterio: Si hay cualquier archivo .py, .sh, .toml, .txt → Gauntlet completo
          ES_SOLO_CONFIG=true
          if echo "$CHANGED_FILES" | grep -qE "\.py$|\.sh$|\.toml$|requirements\.txt|\.txt$"; then
            # Si encontramos archivos productivos → gauntlet completo
            ES_SOLO_CONFIG=false
          fi

          echo "Archivos encontrados:"
          if [ -n "$CHANGED_FILES" ]; then
            echo "$CHANGED_FILES" | head -20
            if echo "$CHANGED_FILES" | grep -qE "\.py$|\.sh$"; then
              echo "→ Cambios en código productivo detectados"
            fi
          fi

          echo "is_config_only=$ES_SOLO_CONFIG" >> "$GITHUB_OUTPUT"
          if [ "$ES_SOLO_CONFIG" = "true" ]; then
            echo "✓ Modo GitOps: Solo cambios de configuración/docs"
          else
            echo "→ Modo Gauntlet Completo: Cambios en código de producto"
          fi

      - name: "Guard: requirements.lock sincronizado con requirements.txt (D3)"
        run: |
          # Si requirements.txt fue modificado, requirements.lock también debe serlo
          if git diff HEAD~1..HEAD --name-only | grep -q "requirements.txt"; then
            echo "requirements.txt fue modificado. Verificando requirements.lock..."
            if ! git diff HEAD~1..HEAD --name-only | grep -q "requirements.lock"; then
              echo "❌ ERROR: requirements.txt cambió pero requirements.lock no fue regenerado"
              echo ""
              echo "Solución:"
              echo "  pip install pip-tools"
              echo "  pip-compile requirements.txt -o requirements.lock"
              echo "  git add requirements.txt requirements.lock"
              echo "  git commit"
              exit 1
            fi
            echo "✓ requirements.lock está sincronizado con requirements.txt"
          fi

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # ---- MODO RÁPIDO: Solo cambios de configuración GitOps / docs ----
      - name: "GitOps: Validar sintaxis y esquemas YAML"
        if: steps.changes.outputs.is_config_only == 'true'
        run: python3 -c "import glob, yaml; [yaml.safe_load(open(f)) for f in glob.glob('data/*.yml') + glob.glob('data/*.yaml')]"

      - name: "GitOps: Tests de Repositorio YAML y Unifilar"
        if: steps.changes.outputs.is_config_only == 'true'
        run: pytest tests/unit/test_yaml_organizaciones_repository.py tests/unit/test_verificador_unifilar.py -q

      # ---- MODO COMPLETO: Cambios en código de producto o arquitectura ----
      - name: Integridad (__init__.py de 0 bytes)
        if: steps.changes.outputs.is_config_only != 'true'
        run: pytest tests/test_empty_inits.py -q

      - name: Estilo (ruff check)
        if: steps.changes.outputs.is_config_only != 'true'
        run: ruff check .

      - name: Formato (ruff format)
        if: steps.changes.outputs.is_config_only != 'true'
        run: ruff format --check .

      - name: Tipado (pyright)
        if: steps.changes.outputs.is_config_only != 'true'
        run: pyright

      - name: Tests unitarios (cobertura >= 85%)
        if: steps.changes.outputs.is_config_only != 'true'
        run: pytest tests/unit --cov=src --cov-report=term-missing --cov-fail-under=85

      - name: Tests de integración
        if: steps.changes.outputs.is_config_only != 'true'
        run: pytest tests/integration -q
