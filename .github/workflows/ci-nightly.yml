name: CI Nightly

# Job diario que detecta breaking changes de dependencias antes de que lleguen a producción.
# Instala desde requirements.txt (no .lock) para testear versiones más nuevas.
on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC = 11 PM ARG (UTC-3, horario estándar)

jobs:
  test-fresh-deps:
    name: Gauntlet con dependencias frescas
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4

      # Sin `data/` los tests de YAML real fallan (ver run 37591679334): mismo checkout que ci.yml.
      - name: Checkout datamaq-data (repo independiente de datos maestros)
        uses: actions/checkout@v7
        with:
          repository: datamaq-automation/datamaq-data
          ssh-key: ${{ secrets.SSH_DEPLOY_KEY_DATA }}
          path: data

      # Misma versión que producción (VPS: 3.12.14): una rotura acá significa "rompería en prod".
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar desde requirements.txt (versiones frescas, no pinadas)
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements.txt

      - name: Correr gauntlet completo (integridad, format, type check, tests)
        run: bash scripts/pre-push.sh

      - name: Alertar por Telegram si falla
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="⚠️ CI Nightly falló — breaking change detectado en datamaq-telemetry

          Dependencias frescas (no pinadas) rompieron el build.

          Revisa los logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Posible solución:
          1. Revisar qué cambió en las dependencias
          2. Actualizar requirements.txt con versiones compatibles
          3. Regenerar requirements.lock: uvx --python 3.12 --from pip-tools pip-compile -o requirements.lock requirements.txt"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -o /dev/null
