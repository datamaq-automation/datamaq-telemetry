# data/facturas_distribuidora.yml — Histórico de facturas de la distribuidora por planta.
# Uno o dos documentos por planta por período (decisión: decisions/2026-09-24_factura-distribuidora-yaml.md
# en el repo padre, corregida el 2026-09-24 al confirmar que UPP recibe la potencia de un
# proveedor y la energía de otro). Se agrega por commit revisado con
# scripts/importar_factura_distribuidora.py, nunca por API (RepositorioOrganizacionesPort es
# solo lectura).
#
# Cada fila es UN documento (`tipo_dato: potencia` o `tipo_dato: energia`), no el período
# completo. Dos filas con el mismo planta_id + periodo pero distinto tipo_dato representan el
# mismo mes facturado por dos proveedores (ver src/domain/sge/entities.py:FacturaDistribuidora).
#
# Campos de potencia discriminados Punta / Fuera de Punta porque así factura la distribuidora en
# Media Tensión (confirmado con una factura real EDELAP tarifa T5M12, ver
# specs/factura-distribuidora.md).
