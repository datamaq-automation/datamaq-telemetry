name: CD Deploy

# CD de producción de datamaq-telemetry: despliega a producción (main, api, 8885).
# Se dispara con el push a main o a mano (workflow_dispatch) sobre main. Staging se despliega aparte
# (deploy-staging.yml, solo workflow_dispatch). No vuelve a correr el gauntlet: la condición es de proceso
# (no se mergea a main un PR con CI rojo o sin terminar; el padre lo verifica con `gh pr checks`).
# Requiere bootstrap previo en el VPS (clon, .venv, systemd, BD, mosquitto, .env).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  target:
    name: Determinar rama y ambiente
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.determine.outputs.branch }}
      name: ${{ steps.determine.outputs.name }}
      environment: ${{ steps.determine.outputs.environment }}
      concurrency: ${{ steps.determine.outputs.concurrency }}
      remote_dir: ${{ steps.determine.outputs.remote_dir }}
      service: ${{ steps.determine.outputs.service }}
      health_url: ${{ steps.determine.outputs.health_url }}
      backup_dir: ${{ steps.determine.outputs.backup_dir }}
      deps_file: ${{ steps.determine.outputs.deps_file }}
    steps:
      - name: Determinar rama y ambiente
        id: determine
        run: |
          # Solo main despliega producción (el guard del job ya lo exige).
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" != "main" ]; then
            echo "❌ Error: rama '$BRANCH' no está autorizada para despliegue (solo main)"
            exit 1
          fi

          echo "branch=main" >> "$GITHUB_OUTPUT"
          echo "name=Deploy a Producción (api, 8885)" >> "$GITHUB_OUTPUT"
          echo "environment=production" >> "$GITHUB_OUTPUT"
          echo "concurrency=deploy-telemetry-production" >> "$GITHUB_OUTPUT"
          echo "remote_dir=/var/www/datamaq-telemetry" >> "$GITHUB_OUTPUT"
          echo "service=datamaq-telemetry.service" >> "$GITHUB_OUTPUT"
          echo "health_url=http://localhost:8885/health/ready" >> "$GITHUB_OUTPUT"
          echo "backup_dir=/tmp/datamaq-telemetry-pre-migracion" >> "$GITHUB_OUTPUT"
          echo "deps_file=/tmp/telemetry-deps.txt" >> "$GITHUB_OUTPUT"

  deploy:
    name: ${{ needs.target.outputs.name }}
    needs: target
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.environment }}
    concurrency:
      group: ${{ needs.target.outputs.concurrency }}
      cancel-in-progress: false
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.target.result == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          log-public-key: false

      - name: Agregar known hosts
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy (pull + deps + restart + health check + rollback)
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_REMOTE_DIR: ${{ needs.target.outputs.remote_dir }}
          DEPLOY_SERVICE_NAME: ${{ needs.target.outputs.service }}
          DEPLOY_HEALTH_URL: ${{ needs.target.outputs.health_url }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_COMMIT: ${{ github.sha }}
          DEPLOY_BACKUP_DIR: ${{ needs.target.outputs.backup_dir }}
          DEPLOY_DEPS_FILE: ${{ needs.target.outputs.deps_file }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          ./scripts/deploy-server.sh 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      - name: "Smoke Test Post-Deploy"
        run: |
          if [ "${{ needs.target.outputs.environment }}" = "production" ]; then
            URL="https://api.datamaq.com.ar/health/ready"
          else
            URL="https://api-dev.datamaq.com.ar/health/ready"
          fi
          python3 scripts/smoke_post_deploy.py "$URL"

      - name: "Alertar por Telegram si falló"
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA_CORTO: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          TARGET: ${{ needs.target.outputs.name }}
        run: |
          LOG="$RUNNER_TEMP/deploy.log"
          if [ -f "$LOG" ] && grep -q "ROLLBACK FALLIDO" "$LOG"; then
            TITULO="🚨 ROLLBACK FALLIDO: servicio CAÍDO en $TARGET"
          elif [ -f "$LOG" ] && grep -q "ROLLBACK INCOMPLETO" "$LOG"; then
            TITULO="🚨 ROLLBACK INCOMPLETO: servicio en estado desconocido ($TARGET)"
          elif [ -f "$LOG" ] && grep -q "el servicio está OK" "$LOG"; then
            TITULO="↩️ Deploy revertido, servicio OK ($TARGET)"
          else
            TITULO="🔴 CD Deploy falló ($TARGET)"
          fi
          MSG="$TITULO — datamaq-telemetry
          Commit: ${SHA_CORTO:0:7} (disparado por ${ACTOR})
          Run: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -o /dev/null -w "Telegram respondió HTTP %{http_code}\n"
