name: CD Deploy

# Despliegue automático del backend datamaq-telemetry al VPS en cada push a main.
# Requiere bootstrap previo en el VPS (clon, .venv, systemd, BD, mosquitto, .env).
# También disponible de forma manual vía workflow_dispatch.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    name: Desplegar al VPS
    runs-on: ubuntu-latest
    # Dependencia explícita: deploy espera a que CI termine con éxito
    # Protección: no corre si CI falla o está en progreso
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    concurrency:
      group: deploy-telemetry
      cancel-in-progress: false
    steps:
      - name: Verificar que CI pasó
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          echo "✓ Deplegando después de CI exitoso"
          echo "Workflow run conclusion: ${{ github.event.workflow_run.conclusion }}"
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "✗ ERROR: CI no pasó (conclusion: ${{ github.event.workflow_run.conclusion }})"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          log-public-key: false

      - name: Agregar known hosts
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$DEPLOY_SSH_PORT" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy (pull + deps + restart + health check + rollback)
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_REMOTE_DIR: ${{ vars.DEPLOY_REMOTE_DIR || '/var/www/datamaq-telemetry' }}
          DEPLOY_SERVICE_NAME: ${{ vars.DEPLOY_SERVICE_NAME || 'datamaq-telemetry.service' }}
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'http://localhost:8000/health/ready' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./scripts/deploy-server.sh

      - name: "Alertar por Telegram si falló (D-3)"
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA_CORTO: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          MSG="🔴 CD Deploy falló — datamaq-telemetry
          Commit: ${SHA_CORTO:0:7} (disparado por ${ACTOR})
          Run: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -o /dev/null -w "Telegram respondió HTTP %{http_code}\n"
